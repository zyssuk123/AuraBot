version: '3.8'

services:
  aurabot-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurabot-detection
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/app/data
      - ./temp:/app/temp
    devices:
      - /dev/video0:/dev/video0
    networks:
      - aurabot-network
    command: python Automatic_detector.py

  aurabot-faceid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurabot-faceid
    privileged: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/app/data
      - ./temp:/app/temp
    devices:
      - /dev/video0:/dev/video0
    networks:
      - aurabot-network
    working_dir: /app/face id
    command: python main.py
    profiles:
      - faceid

networks:
  aurabot-network:
    driver: bridge
